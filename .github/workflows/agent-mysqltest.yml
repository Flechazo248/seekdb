name: Agent MySQLTest (ai_function)

on:
  push:
    branches: [ "feature/**" ]
  workflow_dispatch:
    inputs:
      case_prefix:
        description: 'case name prefix, e.g. ai_function.'
        default: 'ai_function.'

permissions:
  contents: read

jobs:
  mysqltest:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Free Disk Space
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true

      - uses: actions/checkout@v4

      - name: Install ubuntu environment
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y git wget rpm rpm2cpio cpio make build-essential binutils m4 libtool-bin libncurses5 python3

      - name: Cache deps
        id: cache-deps
        uses: actions/cache@v3
        env:
          cache-name: cache-deps
        with:
          key: ${{ runner.os }}-build-${{ env.cache-name }}-el9.x86_64-${{ hashFiles('deps/init/oceanbase.el9.x86_64.deps') }}
          path: deps/3rd

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Build release
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ~/.bashrc ]]; then
            source ~/.bashrc
          fi
          ./build.sh release --init
          echo "$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/bin" >> "$GITHUB_PATH"
          cd build_release
          make -j4
          test -x src/observer/seekdb

      - name: Start mock AI service
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/deploy/mysql_test/test_suite/ai_function/include/ai_function_mock.py start 8000
          sleep 2
          curl -s -o /dev/null -w "mock http status: %{http_code}\n" -X POST \
            -H 'Content-Type: application/json' \
            -d '{"model":"m","input":["x"]}' \
            http://127.0.0.1:8000/compatible-mode/v1/embeddings || true

      - name: Trust the local host key for ssh
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ ! -f ~/.ssh/id_rsa ]; then ssh-keygen -t rsa -b 2048 -N '' -f ~/.ssh/id_rsa -q || true; fi
          if [ -f ~/.ssh/id_rsa.pub ]; then cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys; fi
          chmod 600 ~/.ssh/authorized_keys 2>/dev/null || true
          ssh-keyscan -H 127.0.0.1 localhost 127.0.1.1 >> ~/.ssh/known_hosts 2>/dev/null || true
          echo 'StrictHostKeyChecking no' > ~/.ssh/config
      - name: Run ai_function mysqltest cases
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python3 .github/script/seekdb/agent_run_cases.py \
            --seekdb "$GITHUB_WORKSPACE/build_release/src/observer/seekdb" \
            --obclient "$GITHUB_WORKSPACE/deps/3rd/u01/obclient/bin/obclient" \
            --mysqltest "$GITHUB_WORKSPACE/deps/3rd/u01/obclient/bin/mysqltest" \
            --work-dir "$GITHUB_WORKSPACE/agent_work" \
            --port 2881 \
            --case-prefix "ai_function."

      - name: Run file_sql mysqltest cases
        shell: bash
        run: |
          set -uo pipefail
          python3 .github/script/seekdb/agent_run_cases.py \
            --seekdb "$GITHUB_WORKSPACE/build_release/src/observer/seekdb" \
            --obclient "$GITHUB_WORKSPACE/deps/3rd/u01/obclient/bin/obclient" \
            --mysqltest "$GITHUB_WORKSPACE/deps/3rd/u01/obclient/bin/mysqltest" \
            --work-dir "$GITHUB_WORKSPACE/agent_work" \
            --port 2881 \
            --case-prefix "file_sql."

      - name: Dump mock requests
        if: always()
        shell: bash
        run: |
          python3 tools/deploy/mysql_test/test_suite/ai_function/include/ai_function_mock.py events 8000 || true

      - name: Dump seekdb error context
        if: always()
        shell: bash
        run: |
          set +e
          WORK="$GITHUB_WORKSPACE/agent_work"
          echo "=== workspace tree ==="
          ls -la "$WORK" 2>/dev/null || true
          find "$WORK" -maxdepth 6 -type f \( -name "*.log" -o -name "*.out" -o -name "*.reject" \) 2>/dev/null | head -30
          echo "=== grep AI / error context ==="
          grep -r -a -i -E "ai_function|ai_complete|ai_embed|Null value|NULL_VALUE|curl error|ollama" "$WORK" 2>/dev/null | tail -80 || true
          echo "=== observer log tail ==="
          for f in $(find "$WORK" -maxdepth 6 -type f -name "*.log" 2>/dev/null | head -6); do
            echo "--- $f ---"
            tail -150 "$f"
          done
